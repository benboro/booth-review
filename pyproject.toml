[project]
name = "booth-review"
version = "0.2.0"
description = "Which broadcasters get the best college football games, and who draws viewers beyond what the matchup predicts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Borovinsky" }]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    # httpx2 is Pydantic's maintained fork of httpx (github.com/pydantic/httpx2),
    # not a typosquat; verified at the Phase 1 Task 1 checkpoint (D-14).
    "httpx2>=2.13.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "stamina>=26.1.0",
    "tzdata>=2026.4",
]

[project.scripts]
booth-review = "booth_review.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
    "PTH",          # prefer pathlib
    "DTZ",          # naive datetimes; kickoff times cross time zones
    "RUF",          # ruff-native
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
