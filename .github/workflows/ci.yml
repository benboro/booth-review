name: ci

on:
  # One run per PR push (pull_request) plus main after a merge; a plain
  # branch push without a PR doesn't run CI.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      # The site's CFBD key-leak guard only greps when a key is configured.
      # CI holds no real key (and never gets one as a secret), so this step
      # sets a synthetic canary instead: any build path that read the
      # configured key into dist/site would embed the canary and fail the
      # build, and the grep below fails the step if the guard was skipped.
      - name: Site build key-leak guard (synthetic canary key)
        env:
          CFBD_API_KEY: ci-canary-not-a-real-cfbd-key
        run: |
          out="$(uv run booth-review site --fixture --out dist/site)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qx 'cfbd key check: passed'

  e2e:
    # The browser suite split four ways (tests/e2e/conftest.py hashes each
    # test id into one shard), so the shards run in parallel instead of one
    # ~28-minute job. Together they run every e2e test exactly once.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e -n 4 --tracing retain-on-failure --output test-results
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
