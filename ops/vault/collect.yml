# collect-2026: the scheduled update-pipeline workflow (AUTO-01, AUTO-03).
#
# This file is a TEMPLATE. It is installed in the private data repo's own
# working copy as `.github/workflows/collect.yml` (a manual, user-approved
# step, not part of this repo's own CI). It lives here, under `ops/vault/` and
# outside `.github/`, precisely so it never runs in *this* (public) repo.
# Never name the private repo here; the checkout below reads it via a
# `path: vault` self-checkout instead.
#
# The `schedule.timezone` key (America/New_York, alongside `cron:`) is new
# enough (GA 2026-03-19) that the roadmap flagged it for verification: check
# that the first real scheduled run fires within a few minutes of 10:00 ET
# Sunday / 20:00 ET Wednesday, across the Nov 1 2026 DST fallback too.
#
# GitHub's own scheduler is lossy (an overnight probe on 2026-09-26 saw only
# ~2 of 32 UTC slots fire, some delayed by hours), so the schedule also fires
# backup crons after each main slot (D-12). Main slots are the only ones
# job.catchup.SCHEDULE knows about; `booth-review job run --trigger schedule`
# treats every other slot as a cheap no-op (exit 5) whenever no main slot has
# occurred since the last attempt, so a dropped main slot still gets picked
# up within hours at almost no cost. A main slot whose run failed is retried
# at the next main slot rather than at every backup slot, unless the CFBD step
# hit an outage (5xx, 429, network error): then every backup slot retries it.
#
# The job is the full update pipeline: collect, rebuild, build the site, run
# the CFBD key check, then a gated deploy. Deploy runs only when the job
# reports deploy_ready=true (read from its result file by the "Read the job
# result" step), the job did not exit 3, AND `vars.PUBLISH_ENABLED` is
# exactly `true` (the CLI re-checks the flag, D-01). The gate is computed
# once, by an exact shell compare in the "Validate the deploy settings" step (`steps.gate`):
# Actions expressions compare strings case-insensitively, so `True` or
# `TRUE` would pass a `vars.PUBLISH_ENABLED == 'true'` condition (WR-02). `vars.DEPLOY_REPO` names the target
# repo: a scratch copy for the dry run, `benboro/benboro.github.io` for launch.
# Two repo-scoped deploy-key secrets exist, `DEPLOY_KEY_PROD` (for
# benboro/benboro.github.io) and `DEPLOY_KEY_SCRATCH` (any other DEPLOY_REPO),
# selected by DEPLOY_REPO, so launch is a single PUBLISH_ENABLED flip (D-13).
#
# NFL hang (999.4 CR-02, D-08): `job run` writes its result and attention
# files with the CFB-only outcome as soon as the CFB state is saved, before
# any NFL step, and rewrites them with the final outcome at the end (each
# write atomic). The job step has its own timeout-minutes (45), well under
# the job's 60, so a hung `job run` is killed with time left for the steps
# after it. A step that hits its timeout fails (it is not cancelled) and sets
# no outputs; every later step's `if:` therefore uses `!cancelled()` or
# `always()` instead of the implicit success(), so the CFB-only result still
# deploys and the attention issue says the job step timed out. The workflow
# run still fails, to flag the hang. The 45 minutes cover the CFB part too:
# a CFB part that has not finished by then leaves no result and no deploy.
#
# Rollout order: set JOB_REF to the new tag BEFORE installing this file, since
# an older tag lacks `job run --update`. For the timeout to keep the deploy,
# the tag must also include the early result write (999.4 CR-02); an older
# tag still runs with this file, but a timed-out job step then leaves no
# result file, so that run does not deploy.
#
# Phase 18 (D-14, D-15, D-17): Friday 18:00 and Saturday 08:00 ET are
# schedule-only slots (job.catchup.SCHEDULE_ONLY) with backup crons. They
# re-pull only the CFBD games and media lists and the nflverse schedule, then
# rebuild and deploy under the same gates; they never fetch 506 or ESPN Press
# Room and never move last_success_at, so the Sunday/Wednesday slots behave as
# before. A manual dispatch takes a `mode` input: full (today's run), schedule,
# or rebuild (no collection at all, to publish newly imported crews at once).
# The Friday/Saturday slots and the mode input need a JOB_REF release that
# includes Phase 18 before this template is re-installed in the vault repo (a
# manual step after the merge; check STATE/ROADMAP/todos for a JOB_REF hold
# first). An older tag rejects `--mode`.
#
# The NFL flag (vars.NFL_SITE_ENABLED, exactly true) needs a JOB_REF release
# that includes 999.5 before the variable is set; an older tag ignores it.
name: collect-2026

on:
  schedule:
    - cron: "0 10 * * 0" # Sunday 10:00 America/New_York (main slot, D-11)
      timezone: "America/New_York"
    - cron: "0 12-22/2 * * 0" # Sunday 12,14,16,18,20,22 (backup slots, D-12)
      timezone: "America/New_York"
    - cron: "0 20 * * 3" # Wednesday 20:00 America/New_York (main slot, D-11)
      timezone: "America/New_York"
    - cron: "0 22 * * 3" # Wednesday 22:00 (backup slot, D-12)
      timezone: "America/New_York"
    - cron: "0 6-16/2 * * 4" # Thursday 06,08,10,12,14,16 (backup slots, D-12)
      timezone: "America/New_York"
    - cron: "0 18 * * 5" # Friday 18:00 America/New_York (schedule-only main slot, Phase 18 D-17)
      timezone: "America/New_York"
    - cron: "0 20,22 * * 5" # Friday 20:00, 22:00 (schedule-only backup slots)
      timezone: "America/New_York"
    - cron: "0 8 * * 6" # Saturday 08:00 America/New_York (schedule-only main slot, Phase 18 D-17)
      timezone: "America/New_York"
    - cron: "0 9,10 * * 6" # Saturday 09:00, 10:00 (schedule-only backup slots, before noon kickoffs)
      timezone: "America/New_York"
    # Phase 24 hand-save reminders (D-12, D-13). Each fires at the slot and an hour later; the
    # reminder step below comments each line once. With nothing else due the run is comment-only
    # (fetches nothing), but resolve_mode may turn a reminder cron into a catch-up or retry
    # full run (retry_pending, or a missed main slot), which collects, builds and deploys
    # as usual and still posts its reminder lines as their own comment.
    - cron: "30 17,18 * * 1" # Monday 17:30, 18:30 (ESPN Press Room, Phase 24 D-13)
      timezone: "America/New_York"
    - cron: "30 21,22 * * 2" # Tuesday 21:30, 22:30 (Awful Announcing CFB, Phase 24 D-13)
      timezone: "America/New_York"
    - cron: "0 12,13 * * 3" # Wednesday 12:00, 13:00 (Awful Announcing NFL, Phase 24 D-12)
      timezone: "America/New_York"
    - cron: "30 11,12 * * 5" # Friday 11:30, 12:30 (FOX, Phase 24 D-13)
      timezone: "America/New_York"
    # The Thursday 12:00 (506 NFL, D-12) reminder rides the Thursday 06-16/2 entry above, which
    # also fires at 12:00 and 14:00. An older JOB_REF tag exits 5 at these slots (harmless).
  workflow_dispatch: # manual trigger, used for the D-13 catch-up drill
    inputs:
      mode:
        description: "full runs everything; schedule re-pulls only the schedule; rebuild only rebuilds and deploys (publishes newly imported crews without collecting)"
        type: choice
        options:
          - full
          - schedule
          - rebuild
        default: full

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false # queue a mid-batch run rather than cancel it

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Require a pinned JOB_REF (D-10: never default to main)"
        env:
          JOB_REF: ${{ vars.JOB_REF }}
        run: |
          if [ -z "$JOB_REF" ]; then
            echo "::error::vars.JOB_REF is not set; refusing to check out an unpinned ref" >&2
            exit 1
          fi

      - name: Validate the deploy settings
        id: gate
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
        run: |
          # The only publish gate: an exact, case-sensitive compare (WR-02).
          if [ "$PUBLISH_ENABLED" = "true" ]; then
            if ! printf '%s' "$DEPLOY_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              echo "::error::the DEPLOY_REPO variable must be owner/name when publishing is enabled" >&2
              exit 1
            fi
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publishing disabled"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout vault (self)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vault

      - name: Checkout public repo at pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: benboro/booth-review
          ref: ${{ vars.JOB_REF }}
          path: src
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install booth-review
        working-directory: src
        run: uv sync --locked

      - name: Configure the vault's git identity
        run: |
          git -C vault config user.name "github-actions[bot]"
          git -C vault config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the scheduled update job
        id: job
        # CR-02: well under the job's 60 minutes, leaving time for setup before
        # this step and for the deploy and attention issue after it.
        timeout-minutes: 45
        working-directory: src
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          BOOTH_REVIEW_VAULT: ${{ github.workspace }}/vault
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          # api.github.com only, for nflverse play-by-play listings; 999.4 D-21
          GITHUB_TOKEN: ${{ github.token }}
          # 999.5 D-18/D-20: NFL is on only when this variable is exactly true
          NFL_SITE_ENABLED: ${{ vars.NFL_SITE_ENABLED }}
        run: |
          set +e
          rm -f "$RUNNER_TEMP/result.txt" "$RUNNER_TEMP/attention.md" "$RUNNER_TEMP/reminders.md"
          trigger=manual
          if [ "$EVENT_NAME" = "schedule" ]; then
            trigger=schedule
          fi
          mode=auto
          if [ "$EVENT_NAME" != "schedule" ]; then
            mode="${DISPATCH_MODE:-full}"
          fi
          case "$mode" in
            auto|full|schedule|rebuild) ;;
            *)
              echo "::error::unknown job mode" >&2
              echo "code=2" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          uv run booth-review job run --trigger "$trigger" --mode "$mode" --update \
            --site-out "$RUNNER_TEMP/site" \
            --result-out "$RUNNER_TEMP/result.txt" \
            --attention-out "$RUNNER_TEMP/attention.md" \
            --reminders-out "$RUNNER_TEMP/reminders.md"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Never echo the env or the key; only the count-only exit code above.
          exit 0

      - name: Read the job result
        id: result
        # Runs when the job step finished (success) or hit its timeout
        # (failure; the run block itself always exits 0), never when it was
        # skipped by a setup failure or the run was cancelled. After a
        # timeout, result.txt is the CFB-only file written before the NFL
        # block, or absent if the CFB part never finished.
        if: ${{ !cancelled() && (steps.job.outcome == 'success' || steps.job.outcome == 'failure') }}
        run: |
          if [ -f "$RUNNER_TEMP/result.txt" ]; then
            grep -E '^(deploy_ready|stale_only)=(true|false)$' "$RUNNER_TEMP/result.txt" >> "$GITHUB_OUTPUT" || true
          fi

      - name: Check out the deploy target
        id: target
        # !cancelled(): still deploys the CFB-only result after a job-step
        # timeout (a failed step would skip an implicit success() condition).
        # A timed-out step has no exit code, which is never '3'.
        if: ${{ !cancelled() && steps.result.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes' && steps.job.outputs.code != '3' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          ssh-key: ${{ vars.DEPLOY_REPO == 'benboro/benboro.github.io' && secrets.DEPLOY_KEY_PROD || secrets.DEPLOY_KEY_SCRATCH }}
          path: target
          fetch-depth: 1

      - name: Deploy (only when publishing is on)
        id: deploy
        if: ${{ !cancelled() && steps.target.outcome == 'success' && steps.result.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes' && steps.job.outputs.code != '3' }}
        working-directory: src
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          # 999.5 D-18/D-20: NFL is on only when this variable is exactly true
          NFL_SITE_ENABLED: ${{ vars.NFL_SITE_ENABLED }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          uv run booth-review deploy --site "$RUNNER_TEMP/site" --target "$GITHUB_WORKSPACE/target"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Update the attention issue (count-only, one tracked issue)
        # always(): a setup failure or a timed-out job step (empty code) still
        # opens or updates the issue; exit 5 (nothing due) leaves it untouched.
        if: always() && steps.job.outputs.code != '5'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CODE: ${{ steps.job.outputs.code }}
          JOB_OUTCOME: ${{ steps.job.outcome }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.code }}
          DEPLOY_EXPECTED: ${{ steps.result.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes' && steps.job.outputs.code != '3' }}
          STALE_ONLY: ${{ steps.result.outputs.stale_only }}
        run: |
          title="booth-review job: needs attention"
          run_link="run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create booth-review-job --repo "$GITHUB_REPOSITORY" --force \
            --description "booth-review scheduled job"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label booth-review-job --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            # One-time migration: find the pre-label issue by title and label it.
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label booth-review-job
            fi
          fi

          # WR-03: a deploy that was due but left no exit code (the target
          # checkout or uv failed first) is a problem, never a clean run.
          if [ "$DEPLOY_EXPECTED" = "true" ] && [ -z "$DEPLOY_CODE" ]; then
            DEPLOY_CODE=setup
          fi
          problem=false
          if [ "$JOB_CODE" != "0" ]; then problem=true; fi
          if [ -n "$DEPLOY_CODE" ] && [ "$DEPLOY_CODE" != "0" ]; then problem=true; fi

          # Phase 24: hand-save reminder lines never count as attention (exit code,
          # last_status and the attention count ignore them). They post as their own
          # comment on the needs-attention issue, opened here if need be, whatever the
          # run itself does. WR-07 for them reads the last three comments, never the
          # body, so a body edit cannot swallow a reminder. An issue that holds a
          # reminder is left open by a clean run, as on the comment-only path.
          reminders_file="$RUNNER_TEMP/reminders.md"
          reminders_posted=false
          if [ -f "$reminders_file" ]; then
            reminders_posted=true
            new_reminders=true
            if [ -n "$number" ]; then
              rseen="$RUNNER_TEMP/reminders-seen"
              mkdir -p "$rseen"
              grep '^- ' "$reminders_file" > "$rseen/items.md" || true
              gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json comments \
                --jq '[.comments[-3:][].body] | join("\n")' | tr -d '\r' > "$rseen/recent.md"
              if [ -s "$rseen/items.md" ] && ! grep -Fxv -f "$rseen/recent.md" "$rseen/items.md" > /dev/null; then
                new_reminders=false
              fi
            fi
            if [ "$new_reminders" = "true" ]; then
              echo "" >> "$reminders_file"
              echo "$run_link" >> "$reminders_file"
              if [ -n "$number" ]; then
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$reminders_file"
              else
                # The reminder must live in a comment, never the body: the dedupe above
                # reads comments only, so a body copy would be posted again by the +1h backup.
                intro_file="$RUNNER_TEMP/reminders-intro.md"
                printf '%s\n' "Hand-save reminders follow in the comments." > "$intro_file"
                created=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                  --label booth-review-job --body-file "$intro_file")
                number="${created##*/}"
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$reminders_file"
              fi
            else
              echo "reminders unchanged since the last comments; no new reminder comment"
            fi
          fi

          body_file="$RUNNER_TEMP/attention-body.md"
          if [ -f "$RUNNER_TEMP/attention.md" ]; then
            cp "$RUNNER_TEMP/attention.md" "$body_file"
          elif [ "$STALE_ONLY" = "true" ]; then
            : > "$body_file"
          elif [ "$JOB_OUTCOME" = "failure" ]; then
            echo "job run hit its step timeout without an attention report" > "$body_file"
          else
            echo "job run exited $JOB_CODE without an attention report" > "$body_file"
          fi

          if [ "$STALE_ONLY" = "true" ] && [ ! -f "$RUNNER_TEMP/attention.md" ]; then
            echo "comment-only run with reminders only; nothing else to report"
          elif [ "$STALE_ONLY" = "true" ]; then
            # stale_only is any comment-only run (staleness and/or Phase 24 reminders).
            # WR-07: D-14 checks staleness at every backup slot, but its items
            # rarely change between main runs. Comment only when some item line
            # is missing from the issue's current body or from its last three comments
            # (a reminder comment posted just before this check must not hide an earlier one),
            # so an unchanged report never re-notifies at every backup slot.
            already_posted=false
            if [ -n "$number" ]; then
              seen="$RUNNER_TEMP/attention-seen"
              mkdir -p "$seen"
              grep '^- ' "$body_file" > "$seen/items.md" || true
              gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body \
                --jq '.body' | tr -d '\r' > "$seen/body.md"
              gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json comments \
                --jq '[.comments[-3:][].body] | join("\n")' | tr -d '\r' > "$seen/comment.md"
              if [ -s "$seen/items.md" ]; then
                for posted in "$seen/body.md" "$seen/comment.md"; do
                  if ! grep -Fxv -f "$posted" "$seen/items.md" > /dev/null; then
                    already_posted=true
                  fi
                done
              fi
            fi
            echo "" >> "$body_file"
            echo "$run_link" >> "$body_file"
            if [ "$already_posted" = "true" ]; then
              echo "stale-only report unchanged since the issue was last updated; no new comment"
            elif [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --label booth-review-job --body-file "$body_file"
            fi
          elif [ "$problem" = "true" ]; then
            if [ "$JOB_OUTCOME" = "failure" ]; then
              # CR-02: a timed-out job step. The report above is the CFB-only
              # one `job run` wrote once the CFB part finished, if it did.
              echo "" >> "$body_file"
              if [ -f "$RUNNER_TEMP/result.txt" ]; then
                echo "job run hit its step timeout after the CFB result was saved; later job steps did not finish" >> "$body_file"
              else
                echo "job run hit its step timeout before the CFB result was saved" >> "$body_file"
              fi
            fi
            if [ "$DEPLOY_CODE" = "setup" ]; then
              echo "" >> "$body_file"
              echo "deploy did not run (target checkout or setup failed); the live site was not updated" >> "$body_file"
            elif [ -n "$DEPLOY_CODE" ] && [ "$DEPLOY_CODE" != "0" ]; then
              echo "" >> "$body_file"
              echo "deploy step exited $DEPLOY_CODE; the live site was not updated" >> "$body_file"
            fi
            echo "" >> "$body_file"
            echo "$run_link" >> "$body_file"
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --label booth-review-job --body-file "$body_file"
            fi
          elif [ -n "$number" ] && [ "$reminders_posted" != "true" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "clean run
          $run_link"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Fail the workflow on a hard failure
        if: always()
        env:
          JOB_CODE: ${{ steps.job.outputs.code }}
          JOB_OUTCOME: ${{ steps.job.outcome }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.code }}
          DEPLOY_EXPECTED: ${{ steps.result.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes' && steps.job.outputs.code != '3' }}
        run: |
          if [ "$DEPLOY_EXPECTED" = "true" ] && [ -z "$DEPLOY_CODE" ]; then
            echo "::error::the deploy was due but did not run (target checkout or setup failed)" >&2
            exit 1
          fi
          if [ "$JOB_OUTCOME" = "failure" ]; then
            echo "::error::booth-review job run hit its step timeout" >&2
            exit 1
          fi
          case "$JOB_CODE" in
            0|4|5) ;;
            *)
              echo "::error::booth-review job run exited $JOB_CODE" >&2
              exit 1
              ;;
          esac
          if [ -n "$DEPLOY_CODE" ] && [ "$DEPLOY_CODE" != "0" ]; then
            echo "::error::booth-review deploy exited $DEPLOY_CODE" >&2
            exit 1
          fi
