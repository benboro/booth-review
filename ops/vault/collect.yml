# collect-2026: the scheduled update-pipeline workflow (AUTO-01, AUTO-03).
#
# This file is a TEMPLATE. It is installed in the private data repo's own
# working copy as `.github/workflows/collect.yml` (a manual, user-approved
# step, not part of this repo's own CI). It lives here, under `ops/vault/` and
# outside `.github/`, precisely so it never runs in *this* (public) repo.
# Never name the private repo here; the checkout below reads it via a
# `path: vault` self-checkout instead.
#
# The `schedule.timezone` key (America/New_York, alongside `cron:`) is new
# enough (GA 2026-03-19) that the roadmap flagged it for verification: check
# that the first real scheduled run fires within a few minutes of 10:00 ET
# Sunday / 20:00 ET Wednesday, across the Nov 1 2026 DST fallback too.
#
# GitHub's own scheduler is lossy (an overnight probe on 2026-09-26 saw only
# ~2 of 32 UTC slots fire, some delayed by hours), so the schedule also fires
# backup crons after each main slot (D-12). Main slots are the only ones
# job.catchup.SCHEDULE knows about; `booth-review job run --trigger schedule`
# treats every other slot as a cheap no-op (exit 5) whenever no main slot has
# occurred since the last attempt, so a dropped main slot still gets picked
# up within hours at almost no cost. A main slot whose run failed is retried
# at the next main slot rather than at every backup slot, unless the CFBD step
# hit an outage (5xx, 429, network error): then every backup slot retries it.
#
# The job is the full update pipeline: collect, rebuild, build the site, run
# the CFBD key check, then a gated deploy. Deploy runs only when the job
# reports deploy_ready=true AND `vars.PUBLISH_ENABLED` is exactly `true`
# (the CLI re-checks the flag, D-01). The gate is computed once, by an exact
# shell compare in the "Validate the deploy settings" step (`steps.gate`):
# Actions expressions compare strings case-insensitively, so `True` or
# `TRUE` would pass a `vars.PUBLISH_ENABLED == 'true'` condition (WR-02). `vars.DEPLOY_REPO` names the target
# repo: a scratch copy for the dry run, `benboro/benboro.github.io` for launch.
# Two repo-scoped deploy-key secrets exist, `DEPLOY_KEY_PROD` (for
# benboro/benboro.github.io) and `DEPLOY_KEY_SCRATCH` (any other DEPLOY_REPO),
# selected by DEPLOY_REPO, so launch is a single PUBLISH_ENABLED flip (D-13).
#
# Rollout order: set JOB_REF to the new tag BEFORE installing this file, since
# an older tag lacks `job run --update`.
name: collect-2026

on:
  schedule:
    - cron: "0 10 * * 0" # Sunday 10:00 America/New_York (main slot, D-11)
      timezone: "America/New_York"
    - cron: "0 12-22/2 * * 0" # Sunday 12,14,16,18,20,22 (backup slots, D-12)
      timezone: "America/New_York"
    - cron: "0 20 * * 3" # Wednesday 20:00 America/New_York (main slot, D-11)
      timezone: "America/New_York"
    - cron: "0 22 * * 3" # Wednesday 22:00 (backup slot, D-12)
      timezone: "America/New_York"
    - cron: "0 6-16/2 * * 4" # Thursday 06,08,10,12,14,16 (backup slots, D-12)
      timezone: "America/New_York"
  workflow_dispatch: {} # manual trigger, used for the D-13 catch-up drill

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false # queue a mid-batch run rather than cancel it

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Require a pinned JOB_REF (D-10: never default to main)"
        env:
          JOB_REF: ${{ vars.JOB_REF }}
        run: |
          if [ -z "$JOB_REF" ]; then
            echo "::error::vars.JOB_REF is not set; refusing to check out an unpinned ref" >&2
            exit 1
          fi

      - name: Validate the deploy settings
        id: gate
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
        run: |
          # The only publish gate: an exact, case-sensitive compare (WR-02).
          if [ "$PUBLISH_ENABLED" = "true" ]; then
            if ! printf '%s' "$DEPLOY_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              echo "::error::the DEPLOY_REPO variable must be owner/name when publishing is enabled" >&2
              exit 1
            fi
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publishing disabled"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout vault (self)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vault

      - name: Checkout public repo at pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: benboro/booth-review
          ref: ${{ vars.JOB_REF }}
          path: src
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install booth-review
        working-directory: src
        run: uv sync --locked

      - name: Configure the vault's git identity
        run: |
          git -C vault config user.name "github-actions[bot]"
          git -C vault config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the scheduled update job
        id: job
        working-directory: src
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          BOOTH_REVIEW_VAULT: ${{ github.workspace }}/vault
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          trigger=manual
          if [ "$EVENT_NAME" = "schedule" ]; then
            trigger=schedule
          fi
          uv run booth-review job run --trigger "$trigger" --update \
            --site-out "$RUNNER_TEMP/site" \
            --result-out "$RUNNER_TEMP/result.txt" \
            --attention-out "$RUNNER_TEMP/attention.md"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/result.txt" ]; then
            grep -E '^(deploy_ready|stale_only)=(true|false)$' "$RUNNER_TEMP/result.txt" >> "$GITHUB_OUTPUT"
          fi
          # Never echo the env or the key; only the count-only exit code above.
          exit 0

      - name: Check out the deploy target
        id: target
        if: steps.job.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          ssh-key: ${{ vars.DEPLOY_REPO == 'benboro/benboro.github.io' && secrets.DEPLOY_KEY_PROD || secrets.DEPLOY_KEY_SCRATCH }}
          path: target
          fetch-depth: 1

      - name: Deploy (only when publishing is on)
        id: deploy
        if: steps.job.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes'
        working-directory: src
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          uv run booth-review deploy --site "$RUNNER_TEMP/site" --target "$GITHUB_WORKSPACE/target"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Update the attention issue (count-only, one tracked issue)
        # always(): a setup failure (empty code) still opens the issue;
        # exit 5 (nothing due) leaves it untouched.
        if: always() && steps.job.outputs.code != '5'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_CODE: ${{ steps.job.outputs.code }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.code }}
          DEPLOY_EXPECTED: ${{ steps.job.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes' }}
          STALE_ONLY: ${{ steps.job.outputs.stale_only }}
        run: |
          title="booth-review job: needs attention"
          run_link="run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create booth-review-job --repo "$GITHUB_REPOSITORY" --force \
            --description "booth-review scheduled job"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label booth-review-job --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            # One-time migration: find the pre-label issue by title and label it.
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label booth-review-job
            fi
          fi

          # WR-03: a deploy that was due but left no exit code (the target
          # checkout or uv failed first) is a problem, never a clean run.
          if [ "$DEPLOY_EXPECTED" = "true" ] && [ -z "$DEPLOY_CODE" ]; then
            DEPLOY_CODE=setup
          fi
          problem=false
          if [ "$JOB_CODE" != "0" ]; then problem=true; fi
          if [ -n "$DEPLOY_CODE" ] && [ "$DEPLOY_CODE" != "0" ]; then problem=true; fi

          body_file="$RUNNER_TEMP/attention-body.md"
          if [ -f "$RUNNER_TEMP/attention.md" ]; then
            cp "$RUNNER_TEMP/attention.md" "$body_file"
          else
            echo "job run exited $JOB_CODE without an attention report" > "$body_file"
          fi

          if [ "$STALE_ONLY" = "true" ]; then
            echo "" >> "$body_file"
            echo "$run_link" >> "$body_file"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --label booth-review-job --body-file "$body_file"
            fi
          elif [ "$problem" = "true" ]; then
            if [ "$DEPLOY_CODE" = "setup" ]; then
              echo "" >> "$body_file"
              echo "deploy did not run (target checkout or setup failed); the live site was not updated" >> "$body_file"
            elif [ -n "$DEPLOY_CODE" ] && [ "$DEPLOY_CODE" != "0" ]; then
              echo "" >> "$body_file"
              echo "deploy step exited $DEPLOY_CODE; the live site was not updated" >> "$body_file"
            fi
            echo "" >> "$body_file"
            echo "$run_link" >> "$body_file"
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --label booth-review-job --body-file "$body_file"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "clean run
          $run_link"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Fail the workflow on a hard failure
        if: always()
        env:
          JOB_CODE: ${{ steps.job.outputs.code }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.code }}
          DEPLOY_EXPECTED: ${{ steps.job.outputs.deploy_ready == 'true' && steps.gate.outputs.publish == 'yes' }}
        run: |
          if [ "$DEPLOY_EXPECTED" = "true" ] && [ -z "$DEPLOY_CODE" ]; then
            echo "::error::the deploy was due but did not run (target checkout or setup failed)" >&2
            exit 1
          fi
          case "$JOB_CODE" in
            0|4|5) ;;
            *)
              echo "::error::booth-review job run exited $JOB_CODE" >&2
              exit 1
              ;;
          esac
          if [ -n "$DEPLOY_CODE" ] && [ "$DEPLOY_CODE" != "0" ]; then
            echo "::error::booth-review deploy exited $DEPLOY_CODE" >&2
            exit 1
          fi
